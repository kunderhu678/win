name: Windows 10 Pro RDP

on:
  workflow_dispatch:

jobs:
  run-windows-guacamole:
    runs-on: windows-latest
    steps:
      - name: Configure Native Windows RDP
        shell: powershell
        run: |
          echo "Enabling Remote Desktop Services..."
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          
          echo "Setting up runneradmin authentication..."
          $Password = ConvertTo-SecureString "GuacWinPass123!" -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $Password
          
          echo "Ensuring user access rights..."
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "runneradmin" -ErrorAction SilentlyContinue

      - name: Initialize WSL2 and Ubuntu
        shell: powershell
        run: |
          echo "Installing Ubuntu subsystem..."
          wsl --install -d Ubuntu --no-launch
          Start-Sleep -Seconds 15

      - name: Setup Apache Guacamole Stack inside WSL
        shell: powershell
        run: |
          $bashScript = @'
          # Update and install Docker prerequisites
          apt-get update && apt-get install -y curl iptables
          
          # Force legacy iptables to ensure Docker works smoothly inside WSL2
          update-alternatives --set iptables /usr/sbin/iptables-legacy || true
          
          # Install Docker CE
          curl -fsSL https://get.docker.com -o get-docker.sh
          sh get-docker.sh
          service docker start
          
          # Dynamically fetch the Windows Host Gateway IP from WSL
          WINDOWS_HOST=$(ip route | grep default | awk '{print $3}')
          echo "Windows Host Interface detected at: $WINDOWS_HOST"
          
          # Configure Guacamole User Mapping
          mkdir -p /etc/guacamole
          cat << EOF > /etc/guacamole/user-mapping.xml
          <user-mapping>
              <authorize username="guacadmin" password="guacadmin">
                  <connection name="Windows Runner Native">
                      <protocol>rdp</protocol>
                      <param name="hostname">$WINDOWS_HOST</param>
                      <param name="port">3389</param>
                      <param name="security">any</param>
                      <param name="ignore-cert">true</param>
                      <param name="username">runneradmin</param>
                      <param name="password">GuacWinPass123!</param>
                  </connection>
              </authorize>
          </user-mapping>
          EOF
          
          # Spin up the Guacamole Stack
          docker network create guac-net
          docker run -d --name guacd --network guac-net guacamole/guacd:latest
          docker run -d --name guacamole --network guac-net \
            -e GUACD_HOSTNAME=guacd \
            -e GUACD_PORT=4822 \
            -v /etc/guacamole:/etc/guacamole \
            -p 8080:8080 \
            guacamole/guacamole:latest
          '@
          
          # Clean up carriage returns for Linux compatibility and execute
          $bashScript = $bashScript -replace "`r", ""
          [System.IO.File]::WriteAllText("C:\setup_guac.sh", $bashScript)
          wsl -u root bash /mnt/c/setup_guac.sh

      - name: Deploy Cloudflare Tunnel (trycloudflare)
        shell: powershell
        run: |
          echo "Downloading Cloudflare Binary..."
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "cloudflared.exe"
          
          echo "Initializing secure tunnel to Guacamole..."
          Start-Process -FilePath ".\cloudflared.exe" -ArgumentList "tunnel --url http://localhost:8080" -RedirectStandardError "tunnel.log" -NoNewWindow
          
          # Give Cloudflare a moment to register a public domain assignment
          Start-Sleep -Seconds 12
          
          # Extract the URL from the logging track
          $TunnelUrl = ""
          if (Test-Path "tunnel.log") {
              $LogContent = Get-Content "tunnel.log"
              if ($LogContent -match "https://[-a-zA-Z0-9]*\.trycloudflare\.com") {
                  $TunnelUrl = $Matches[0]
              }
          }
          
          if ([string]::IsNullOrEmpty($TunnelUrl)) {
              Write-Error "Cloudflare failed to initialize public assignment. Log Context:"
              Get-Content "tunnel.log"
              exit 1
          }
          
          Write-Host "========================================================"
          Write-Host "🌐 APACHE GUACAMOLE WEB ADDRESS:"
          Write-Host "Link: $TunnelUrl/guacamole/"
          Write-Host ""
          Write-Host "👤 Guacamole Login: guacadmin"
          Write-Host "🔑 Guacamole Password: guacadmin"
          Write-Host "========================================================"

      - name: Keep Runner Session Alive
        shell: powershell
        run: |
          Write-Host "System is active. Connection loop is monitoring live states."
          Write-Host "To end this session, cancel the workflow run manually."
          
          # Standard maximum execution loop (6 hours / 360 minutes max runner time limit)
          for ($i = 1; $i -le 360; $i++) {
              Start-Sleep -Seconds 60
              if (($i % 10) -eq 0) {
                  Write-Host "Session active check: $i minutes elapsed."
              }
          }
