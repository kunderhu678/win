name: Windows 10 Pro RDP

on:
  workflow_dispatch:

jobs:
  run-windows-guacamole:
    runs-on: windows-latest
    steps:
      - name: Configure Native Windows RDP
        shell: powershell
        run: |
          echo "Enabling Remote Desktop Services..."
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          
          echo "Setting up runneradmin authentication..."
          $Password = ConvertTo-SecureString "GuacWinPass123!" -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $Password
          
          echo "Ensuring user access rights..."
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "runneradmin" -ErrorAction SilentlyContinue

      - name: Initialize WSL2 and Ubuntu
        shell: powershell
        run: |
          echo "Installing Ubuntu subsystem..."
          wsl --install -d Ubuntu --no-launch
          Start-Sleep -Seconds 15

      - name: Setup Apache Guacamole Stack inside WSL
        shell: powershell
        run: |
          $setupScript = @'
          #!/bin/bash
          set -e

          echo "Installing Docker stack components..."
          apt-get update && apt-get install -y curl docker-compose-v2
          
          echo "Starting Docker Engine..."
          service docker start
          sleep 5

          echo "Preparing database migration files..."
          mkdir -p /etc/guacamole/init
          docker run --rm guacamole/guacamole:latest /opt/guacamole/bin/initdb.sh --postgresql > /etc/guacamole/init/initdb.sql

          echo "Generating deployment blueprint..."
          cat << EOF > /etc/guacamole/docker-compose.yml
          version: '3.8'
          services:
            postgres:
              image: postgres:15-alpine
              container_name: guac-postgres
              network_mode: host
              environment:
                POSTGRES_DB: guacamole_db
                POSTGRES_USER: guacadmin
                POSTGRES_PASSWORD: GuacSecurePassword123!
              volumes:
                - /etc/guacamole/init:/docker-entrypoint-initdb.d
              restart: always

            guacd:
              image: guacamole/guacd:latest
              container_name: guac-guacd
              network_mode: host
              restart: always

            guacamole:
              image: guacamole/guacamole:latest
              container_name: guac-web
              network_mode: host
              environment:
                GUACD_HOSTNAME: 127.0.0.1
                POSTGRES_HOSTNAME: 127.0.0.1
                POSTGRES_DATABASE: guacamole_db
                POSTGRES_USER: guacadmin
                POSTGRES_PASSWORD: GuacSecurePassword123!
              restart: always
          EOF

          echo "Staging Deployment Strategy..."
          cd /etc/guacamole
          
          echo "Bringing up database cluster..."
          docker compose up -d postgres
          
          echo "Allowing schema ingestion processing (20 seconds)..."
          sleep 20
          
          echo "Launching dependent web and routing daemons..."
          docker compose up -d guacd guacamole
          '@

          $setupScript = $setupScript -replace "`r", ""
          [System.IO.File]::WriteAllText("C:\setup_guac.sh", $setupScript)
          wsl -u root bash /mnt/c/setup_guac.sh

      - name: Deploy Cloudflare Tunnel & Keep Session Alive
        shell: powershell
        run: |
          echo "Verifying local application endpoint health (Polling port 8080)..."
          $LocalReady = $false
          for ($i = 1; $i -le 60; $i++) {
              try {
                  $Response = Invoke-WebRequest -Uri "http://127.0.0.1:8080/guacamole/" -Method Head -TimeoutSec 2 -ErrorAction SilentlyContinue
                  if ($Response.StatusCode -eq 200 -or $Response.StatusCode -eq 302) {
                      $LocalReady = $true
                      break
                  }
              } catch {
                  # Waiting on servlet startup mapping lifecycle
              }
              Start-Sleep -Seconds 2
          }

          if (-not $LocalReady) {
              Write-Host "================= DIAGNOSTIC ENGINE LOG DUMP ================="
              Write-Host "CONTAINER COMPONENT STATES:"
              wsl docker ps -a
              Write-Host ""
              Write-Host "GUACAMOLE WEB LOGS:"
              wsl docker logs guac-web --tail 40
              Write-Host ""
              Write-Host "POSTGRES DB LOGS:"
              wsl docker logs guac-postgres --tail 40
              Write-Host "==============================================================="
              Write-Error "Guacamole web dashboard failed to reply on port 8080."
              exit 1
          }

          echo "Downloading Cloudflare Binary..."
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "cloudflared.exe"
          
          echo "Initializing secure tunnel..."
          Start-Process cmd -ArgumentList "/c .\cloudflared.exe tunnel --url http://localhost:8080 > tunnel.log 2>&1" -NoNewWindow
          
          echo "Fetching assigned URL configuration..."
          $TunnelUrl = ""
          for ($j = 1; $j -le 30; $j++) {
              Start-Sleep -Seconds 1
              if (Test-Path "tunnel.log") {
                  $LogContent = Get-Content "tunnel.log" -Raw -ErrorAction SilentlyContinue
                  if ($LogContent) {
                      $RegexMatch = [regex]::Match([string]$LogContent, "https://[a-zA-Z0-9\-]+\.trycloudflare\.com")
                      if ($RegexMatch.Success) {
                          $TunnelUrl = $RegexMatch.Value
                          break
                      }
                  }
              }
          }
          
          if ([string]::IsNullOrEmpty($TunnelUrl)) {
              Write-Error "Tunnel orchestration timed out. System diagnostics log:"
              Get-Content "tunnel.log" -ErrorAction SilentlyContinue
              exit 1
          }
          
          # Compute host gateway endpoint cleanly via standard regex routing extraction
          $WslRoute = wsl ip route | Select-String "default"
          $WindowsIP = [regex]::Match($WslRoute, '(?<=via\s)[0-9\.]+').Value
          
          Write-Host "========================================================"
          Write-Host "APACHE GUACAMOLE CONNECTIVITY PORTAL"
          Write-Host "========================================================"
          Write-Host "Access Link: $TunnelUrl/guacamole/"
          Write-Host ""
          Write-Host "DEFAULT DASHBOARD LOGIN:"
          Write-Host "Username: guacadmin"
          Write-Host "Password: guacadmin"
          Write-Host "========================================================"
          Write-Host "MANUAL CONNECTION PARAMETERS (Add inside dashboard Settings):"
          Write-Host "Protocol: rdp"
          Write-Host "Hostname: $WindowsIP"
          Write-Host "Port: 3389"
          Write-Host "Username: runneradmin"
          Write-Host "Password: GuacWinPass123!"
          Write-Host "Ignore Server Certificate: Checked / True"
          Write-Host "========================================================"
          
          # Maintain structural runtime context state
          for ($k = 1; $k -le 360; $k++) {
              Start-Sleep -Seconds 60
              if (($k % 10) -eq 0) {
                  Write-Host "Runtime heartbeat tracking check: $k minutes active."
              }
          }
