name: Windows RDP via Guacamole Browser

on:
  workflow_dispatch:

jobs:
  windows-rdp-guacamole:
    runs-on: windows-latest
    timeout-minutes: 360
    
    steps:
      - name: Configure Windows Runner for RDP Access
        shell: pwsh
        run: |
          Write-Host "Configuring Windows Runner for RDP access..."
          
          # Enable RDP
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          
          # Configure RDP to not require Network Level Authentication
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0
          
          # Set password for runneradmin (the default GitHub Actions user)
          $rdpPassword = "RunnerPass123!"
          $password = ConvertTo-SecureString $rdpPassword -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $password
          
          # Add runneradmin to Remote Desktop Users group
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "runneradmin"
          
          # Make sure TermService is running
          Set-Service -Name TermService -StartupType Automatic
          Restart-Service TermService -Force
          
          # Get the IP address for reference
          $ipAddress = (Get-NetIPAddress -AddressFamily IPv4 | Where-Object {$_.InterfaceAlias -notlike "*Loopback*"} | Select-Object -First 1).IPAddress
          
          Write-Host "========================================================" -ForegroundColor Green
          Write-Host "RDP Configuration Complete!" -ForegroundColor Green
          Write-Host "Windows IP: $ipAddress" -ForegroundColor Cyan
          Write-Host "RDP Username: runneradmin" -ForegroundColor Yellow
          Write-Host "RDP Password: RunnerPass123!" -ForegroundColor Yellow
          Write-Host "RDP Port: 3389" -ForegroundColor Yellow
          Write-Host "========================================================" -ForegroundColor Green

      - name: Install WSL and Docker
        shell: pwsh
        run: |
          Write-Host "Installing WSL..."
          wsl --install -d Ubuntu-22.04 --no-launch
          Start-Sleep -Seconds 30
          
          Write-Host "Installing Docker in WSL..."
          wsl bash -c "sudo apt-get update && sudo apt-get install -y ca-certificates curl"
          wsl bash -c "curl -fsSL https://get.docker.com | sudo sh"
          wsl bash -c "sudo service docker start"
          
          Write-Host "Docker ready"

      - name: Setup Apache Guacamole in Docker
        shell: pwsh
        run: |
          Write-Host "Setting up Guacamole..."
          
          # Create guacamole config directory
          wsl bash -c "sudo mkdir -p /opt/guacamole"
          
          # Create user-mapping.xml for Guacamole authentication
          # This tells Guacamole to connect to the Windows host's RDP
          $userMapping = @'
<user-mapping>
    <authorize username="guacadmin" password="guacadmin">
        <connection name="GitHub Windows Runner">
            <protocol>rdp</protocol>
            <param name="hostname">host.docker.internal</param>
            <param name="port">3389</param>
            <param name="username">runneradmin</param>
            <param name="password">RunnerPass123!</param>
            <param name="ignore-cert">true</param>
            <param name="security">any</param>
            <param name="resize-method">display-update</param>
            <param name="enable-wallpaper">false</param>
            <param name="enable-theming">false</param>
            <param name="enable-font-smoothing">true</param>
            <param name="enable-full-window-drag">false</param>
            <param name="enable-desktop-composition">false</param>
            <param name="enable-menu-animations">false</param>
        </connection>
    </authorize>
</user-mapping>
'@
          
          # Save to temp file
          $tempPath = "$env:TEMP\user-mapping.xml"
          $userMapping | Out-File -FilePath $tempPath -Encoding ASCII -NoNewline
          
          # Copy to WSL
          wsl bash -c "sudo cp '$(wslpath -u $tempPath)' /opt/guacamole/user-mapping.xml"
          
          # Start Guacamole daemon (guacd)
          Write-Host "Starting guacd container..."
          wsl bash -c "sudo docker run -d --name guacd --restart unless-stopped guacamole/guacd"
          
          # Start Guacamole web client
          Write-Host "Starting Guacamole web client..."
          wsl bash -c "sudo docker run -d --name guacamole --restart unless-stopped --add-host=host.docker.internal:host-gateway -e GUACD_HOSTNAME=guacd -e GUACD_PORT=4822 -v /opt/guacamole:/etc/guacamole --link guacd:guacd -p 8080:8080 guacamole/guacamole"
          
          Start-Sleep -Seconds 5
          
          # Verify containers are running
          Write-Host "Checking container status..."
          wsl bash -c "sudo docker ps"

      - name: Setup Cloudflare Tunnel
        shell: pwsh
        run: |
          Write-Host "Downloading and installing Cloudflare tunnel..."
          
          # Install cloudflared in WSL
          wsl bash -c "wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -O /tmp/cloudflared.deb"
          wsl bash -c "sudo dpkg -i /tmp/cloudflared.deb"
          
          Write-Host "Starting Cloudflare tunnel to expose Guacamole..."
          
          # Start tunnel and capture output
          wsl bash -c "cloudflared tunnel --url http://localhost:8080 2>&1 | tee /tmp/tunnel.log &"
          
          # Wait for tunnel URL
          Write-Host "Waiting for tunnel URL..."
          Start-Sleep -Seconds 15
          
          # Extract the URL - try multiple patterns
          $tunnelUrl = wsl bash -c "grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' /tmp/tunnel.log | head -1"
          
          if (-not $tunnelUrl) {
            Write-Host "First attempt failed, trying again..."
            Start-Sleep -Seconds 10
            $tunnelUrl = wsl bash -c "grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' /tmp/tunnel.log | head -1"
          }
          
          if ($tunnelUrl) {
            Write-Host "Tunnel URL: $tunnelUrl"
            echo "TUNNEL_URL=$tunnelUrl" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            Write-Host "Could not extract URL, showing full tunnel log:"
            wsl bash -c "cat /tmp/tunnel.log"
          }

      - name: Display Access Information
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========================================================" -ForegroundColor Green
          Write-Host "🌐 BROWSER-BASED WINDOWS RDP ACCESS" -ForegroundColor Green
          Write-Host "========================================================" -ForegroundColor Green
          Write-Host ""
          
          if ($env:TUNNEL_URL) {
            $fullUrl = "$env:TUNNEL_URL/guacamole"
            Write-Host "🔗 ACCESS URL:" -ForegroundColor Yellow
            Write-Host "   $fullUrl" -ForegroundColor Cyan
            Write-Host ""
            Write-Host "📋 LOGIN DETAILS:" -ForegroundColor Yellow
            Write-Host "   Guacamole Username: guacadmin" -ForegroundColor White
            Write-Host "   Guacamole Password: guacadmin" -ForegroundColor White
            Write-Host ""
            Write-Host "💻 WINDOWS RDP (auto-filled):" -ForegroundColor Yellow
            Write-Host "   Username: runneradmin" -ForegroundColor White
            Write-Host "   Password: RunnerPass123!" -ForegroundColor White
            Write-Host ""
            Write-Host "📝 STEPS:" -ForegroundColor Yellow
            Write-Host "   1. Open the URL above in your browser" -ForegroundColor White
            Write-Host "   2. Login with guacadmin / guacadmin" -ForegroundColor White
            Write-Host "   3. Click on 'GitHub Windows Runner' connection" -ForegroundColor White
            Write-Host "   4. You'll see the Windows desktop in your browser!" -ForegroundColor White
          } else {
            Write-Host "⚠️  Tunnel URL not available" -ForegroundColor Red
            Write-Host "Checking if services are running..." -ForegroundColor Yellow
            Write-Host ""
            wsl bash -c "sudo docker ps"
            Write-Host ""
            wsl bash -c "cat /tmp/tunnel.log 2>/dev/null"
          }
          
          Write-Host ""
          Write-Host "⏱️  Session will remain active for up to 6 hours" -ForegroundColor Green
          Write-Host "========================================================" -ForegroundColor Green
          Write-Host ""

      - name: Keep Session Alive
        shell: pwsh
        run: |
          $timeout = 350 * 60  # 350 minutes
          $startTime = Get-Date
          $lastUpdate = 0
          
          while ($true) {
            $elapsed = ((Get-Date) - $startTime).TotalSeconds
            
            if ($elapsed -ge $timeout) {
              Write-Host "Maximum session duration reached."
              break
            }
            
            # Update every 2 minutes
            if ($elapsed - $lastUpdate -ge 120) {
              $remaining = [math]::Round(($timeout - $elapsed) / 60)
              Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Windows RDP session active - $remaining minutes remaining" -ForegroundColor Cyan
              $lastUpdate = $elapsed
            }
            
            Start-Sleep -Seconds 30
          }
