name: Windows RDP via Guacamole

on:
  workflow_dispatch:

jobs:
  windows-rdp-guacamole:
    runs-on: windows-latest
    timeout-minutes: 360
    
    steps:
      - name: Configure Windows for RDP
        shell: pwsh
        run: |
          # Enable RDP
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          
          # Set RDP security layer
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0
          
          # Set password for existing runneradmin user
          $rdpPassword = "RunnerPass123!"
          $password = ConvertTo-SecureString $rdpPassword -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $password -ErrorAction SilentlyContinue
          
          # Add to Remote Desktop Users
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "runneradmin" -ErrorAction SilentlyContinue
          
          # Restart RDP service
          Restart-Service TermService -Force
          
          Write-Host "RDP configured. Username: runneradmin, Password: $rdpPassword"

      - name: Install WSL
        shell: pwsh
        run: |
          Write-Host "Installing WSL..."
          wsl --install -d Ubuntu-22.04 --no-launch 2>$null
          Start-Sleep -Seconds 30
          wsl --set-default-version 2
          Write-Host "WSL installed"

      - name: Setup Docker in WSL
        shell: pwsh
        run: |
          Write-Host "Installing Docker..."
          wsl bash -c "sudo apt-get update -qq"
          wsl bash -c "curl -fsSL https://get.docker.com | sudo sh"
          wsl bash -c "sudo service docker start"
          Write-Host "Docker installed and started"

      - name: Create Guacamole Configuration
        shell: pwsh
        run: |
          Write-Host "Creating Guacamole configuration..."
          
          # Create directory
          wsl bash -c "sudo mkdir -p /etc/guacamole"
          
          # Create user-mapping.xml with proper escaping
          $xmlContent = @'
<user-mapping>
    <authorize username="guacadmin" password="guacadmin">
        <connection name="Windows Runner RDP">
            <protocol>rdp</protocol>
            <param name="hostname">host.docker.internal</param>
            <param name="port">3389</param>
            <param name="security">any</param>
            <param name="ignore-cert">true</param>
            <param name="username">runneradmin</param>
            <param name="password">RunnerPass123!</param>
        </connection>
    </authorize>
</user-mapping>
'@
          
          # Save XML to a temp file and copy to WSL
          $xmlPath = "$env:TEMP\user-mapping.xml"
          $xmlContent | Out-File -FilePath $xmlPath -Encoding ASCII
          
          # Copy to WSL
          $wslPath = $xmlPath -replace '\\', '/' -replace 'C:', '/mnt/c'
          wsl bash -c "sudo cp $wslPath /etc/guacamole/user-mapping.xml"
          
          Write-Host "Guacamole configuration created"

      - name: Start Guacamole Daemon
        shell: pwsh
        run: |
          Write-Host "Starting guacd..."
          wsl bash -c "sudo docker run -d --name guacd --restart unless-stopped guacamole/guacd"
          Write-Host "guacd started"

      - name: Start Guacamole Web Client
        shell: pwsh
        run: |
          Write-Host "Starting Guacamole web client..."
          wsl bash -c "sudo docker run -d --name guacamole --restart unless-stopped -e GUACD_HOSTNAME=guacd -e GUACD_PORT=4822 -v /etc/guacamole:/etc/guacamole --link guacd:guacd -p 8080:8080 guacamole/guacamole"
          Start-Sleep -Seconds 5
          Write-Host "Guacamole web client started"
          
          # Test if it's running
          wsl bash -c "curl -s http://localhost:8080/guacamole/ | head -n 3"

      - name: Setup Cloudflare Tunnel
        shell: pwsh
        run: |
          Write-Host "Installing Cloudflare tunnel..."
          wsl bash -c "wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb"
          wsl bash -c "sudo dpkg -i cloudflared-linux-amd64.deb"
          
          Write-Host "Starting Cloudflare tunnel..."
          wsl bash -c "nohup cloudflared tunnel --url http://localhost:8080 > /tmp/tunnel.log 2>&1 &"
          
          Write-Host "Waiting for tunnel to establish..."
          Start-Sleep -Seconds 15
          
          # Extract tunnel URL
          $tunnelUrl = wsl bash -c "grep -o 'https://[-a-zA-Z0-9]*\.trycloudflare\.com' /tmp/tunnel.log | head -n 1"
          
          if (-not $tunnelUrl) {
            Write-Host "Waiting additional time for tunnel..."
            Start-Sleep -Seconds 10
            $tunnelUrl = wsl bash -c "grep -o 'https://[-a-zA-Z0-9]*\.trycloudflare\.com' /tmp/tunnel.log | head -n 1"
          }
          
          Write-Host "Tunnel URL: $tunnelUrl"
          echo "TUNNEL_URL=$tunnelUrl" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Display Connection Information
        shell: pwsh
        run: |
          Write-Host "========================================================" -ForegroundColor Green
          Write-Host "APACHE GUACAMOLE WEB INTERFACE" -ForegroundColor Green
          Write-Host "========================================================" -ForegroundColor Green
          
          if ($env:TUNNEL_URL) {
            Write-Host "URL: $env:TUNNEL_URL/guacamole" -ForegroundColor Cyan
          } else {
            Write-Host "Tunnel URL not found. Checking logs..." -ForegroundColor Yellow
            wsl bash -c "cat /tmp/tunnel.log"
          }
          
          Write-Host ""
          Write-Host "GUACAMOLE LOGIN:" -ForegroundColor Yellow
          Write-Host "Username: guacadmin" -ForegroundColor White
          Write-Host "Password: guacadmin" -ForegroundColor White
          Write-Host ""
          Write-Host "WINDOWS RDP CREDENTIALS:" -ForegroundColor Yellow
          Write-Host "Username: runneradmin" -ForegroundColor White
          Write-Host "Password: RunnerPass123!" -ForegroundColor White
          Write-Host ""
          Write-Host "INSTRUCTIONS:" -ForegroundColor Yellow
          Write-Host "1. Open the Guacamole URL in your browser" -ForegroundColor White
          Write-Host "2. Log in with the credentials above" -ForegroundColor White
          Write-Host "3. Click on 'Windows Runner RDP' to connect" -ForegroundColor White
          Write-Host "========================================================" -ForegroundColor Green

      - name: Keep Session Alive
        shell: pwsh
        run: |
          Write-Host "Session will remain active for up to 6 hours" -ForegroundColor Green
          
          $jobTimeout = 350 * 60
          $startTime = Get-Date
          $lastStatus = 0
          
          while ($true) {
            $elapsed = ((Get-Date) - $startTime).TotalSeconds
            
            if ($elapsed -gt $jobTimeout) {
              Write-Host "Timeout reached. Shutting down..."
              break
            }
            
            if ($elapsed - $lastStatus -ge 120) {
              $remaining = [math]::Round(($jobTimeout - $elapsed) / 60)
              Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Active - $remaining minutes remaining" -ForegroundColor Cyan
              $lastStatus = $elapsed
            }
            
            Start-Sleep -Seconds 15
          }
